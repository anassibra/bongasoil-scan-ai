<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1f2937">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="BonGasoil">
  <title>BonGasoil Scan</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="icon" href="icon.svg">
</head>
<body>

  <header class="app-header">
    <div class="header-content">
      <h1 class="app-title">⛽ BonGasoil Scan</h1>
      <div class="header-stats">
        <div class="stat-mini">
          <span class="stat-value" id="statCount">0</span>
          <span class="stat-label">bons</span>
        </div>
        <div class="stat-mini">
          <span class="stat-value" id="statTotal">0</span>
          <span class="stat-label">DH</span>
        </div>
      </div>
    </div>
  </header>

  <main class="app-main">

    <section class="action-section">
      <button id="btnOpenScanner" class="btn-primary btn-lg">📷 Scanner un Bon</button>
      <button id="btnExportExcel" class="btn-secondary btn-lg">📊 Exporter Excel</button>
    </section>

    <section class="filters-section">
      <div class="filter-row">
        <input type="text" id="searchInput" class="filter-input" placeholder="🔍 Rechercher...">
      </div>
      <div class="filter-row">
        <select id="filterDeptSelect" class="filter-select">
          <option value="ALL">Tous les depts</option>
        </select>
        <select id="filterPersonSelect" class="filter-select">
          <option value="ALL">Toutes les personnes</option>
        </select>
      </div>
      <div class="filter-row">
        <select id="filterPlateSelect" class="filter-select">
          <option value="ALL">Toutes les immatriculations</option>
        </select>
      </div>
      <button id="btnResetFilters" class="btn-reset">🔄 Réinitialiser</button>
    </section>

    <section class="table-section">
      <div class="table-container">
        <table class="simple-table">
          <thead>
            <tr>
              <th>Personne</th>
              <th>Date</th>
              <th>Montant</th>
              <th>Dept</th>
              <th>Immatriculation</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">📋</div>
        <p>Aucun bon enregistré</p>
      </div>
    </section>

  </main>

  <!-- Modal Camera (redesigné) -->
  <div id="cameraModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content modal-fullscreen">
      <div class="camera-topbar">
        <button id="btnCloseCameraModal" class="btn-close-camera">&times;</button>
        <span class="camera-title">Scanner un Bon</span>
        <span style="width:36px;"></span>
      </div>
      <div class="camera-container">
        <video id="scannerVideo" class="camera-video" autoplay playsinline muted></video>
        <div class="camera-frame"></div>
        <div id="captureCountdown" class="capture-countdown"></div>
      </div>
      <div class="camera-bottombar">
        <button id="btnUploadPhoto" class="btn-upload-photo">
          <span class="upload-icon">📁</span>
          <span>Importer</span>
        </button>
        <button id="btnCapturePhoto" class="btn-capture-main" aria-label="Capturer"></button>
        <div style="width:64px;"></div>
      </div>
      <input type="file" id="fileInputCamera" accept="image/*" style="display:none;">
    </div>
  </div>

  <!-- Modal Edit/Validation -->
  <div id="editRecordModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="editModalTitle">Valider le Bon</h2>
        <button id="btnCloseEditModal" class="btn-close">&times;</button>
      </div>
      <div class="modal-body">
        <img id="editModalImagePreview" class="preview-image" src="" alt="Bon" style="display: none;">
        
        <form id="recordForm" class="form-simple">
          <div class="form-group">
            <label>Personne <span class="auto-tag">détection auto</span></label>
            <input type="text" id="inputNomPrenom" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label>Date <span class="auto-tag">détection auto</span></label>
            <input type="date" id="inputDate" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label>Montant (MAD) <span class="auto-tag">détection auto</span></label>
            <input type="number" id="inputMontant" class="form-input" step="0.01" required>
          </div>
          
          <div class="form-group">
            <label>Département ✍️ <span class="manual-tag">à choisir</span></label>
            <select id="inputDepartement" class="form-input" required></select>
          </div>
          
          <div class="form-group">
            <label>Kilométrage <span class="auto-tag">détection auto</span></label>
            <input type="number" id="inputKilometrage" class="form-input" required>
          </div>
          
          <div class="form-group">
            <label>Immatriculation <span class="auto-tag">détection auto</span></label>
            <input type="text" id="inputImmatriculation" class="form-input" required>
          </div>
          
          <div class="form-actions">
            <button type="button" id="btnCancelEdit" class="btn-secondary">Annuler</button>
            <button type="submit" class="btn-primary">Enregistrer</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Modal Voir Image -->
  <div id="viewImageModal" class="modal">
    <div class="modal-overlay"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h2>Bon Scanné</h2>
        <button id="btnCloseViewModal" class="btn-close">&times;</button>
      </div>
      <img id="viewModalImage" class="preview-image" src="" alt="Bon">
    </div>
  </div>

  <button id="btnFab" class="fab-button" onclick="document.getElementById('btnOpenScanner').click()" aria-label="Scanner">📷</button>

  <div id="toastContainer" class="toast-container"></div>

  <script src="sample_data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/service-worker.js")
          .then(() => console.log("Service Worker enregistré"))
          .catch((err) => console.error("Erreur SW:", err));
      });
    }
  </script>
</body>
</html>
